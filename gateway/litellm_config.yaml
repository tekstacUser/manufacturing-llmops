# =============================================================
# LiteLLM Gateway Configuration
# =============================================================
# Exposes three model aliases routing to BentoML/llama.cpp services.
# Each BentoML service implements an OpenAI-compatible endpoint,
# so LiteLLM connects using the standard provider with a custom base URL.
# =============================================================

# TODO: Define top-level model catalog list key (e.g., 'model_list:')
#
# Configure 3 endpoint items in the list:
#
# 1. First Entry (Lightweight Default Model):
#    - Outer model identifier key set to default small model alias
#    - Gateway parameters sub-dictionary containing:
#        * provider model path: "openai/small-model"
#        * internal endpoint URL: "http://bentoml-small:3000/v1"
#        * authentication key setting: "not-needed"
#        * timeout limit: 60
#        * retry attempts: 1
#
# 2. Second Entry (Complex / Medium Model):
#    - Outer model identifier key set to complex medium model alias
#    - Gateway parameters sub-dictionary containing:
#        * provider model path: "openai/medium-model"
#        * internal endpoint URL: "http://bentoml-medium:3000/v1"
#        * authentication key setting: "not-needed"
#        * timeout limit: 60
#        * retry attempts: 1
#
# 3. Third Entry (Optimized / Quantized Model):
#    - Outer model identifier key set to quantized model alias
#    - Gateway parameters sub-dictionary containing:
#        * provider model path: "openai/quantized-model"
#        * internal endpoint URL: "http://bentoml-quantized:3000/v1"
#        * authentication key setting: "not-needed"
#        * timeout limit: 60
#        * retry attempts: 1

# TODO: Configure router fallback logic under routing configuration key (e.g., 'router_settings:')
#    - Define backup routes array under fallback rules:
#        * medium model failure falls back to default small model
#        * quantized model failure falls back to default small model
#    - Set global gateway timeout to 60 seconds
#    - Set max retry attempts count to 1

